services:
  server:
    image: deminy/swoole-by-examples:server-6.2
    environment:
      # ROOT_DIR limits what the autoreload script watches; without it, any PHP file changed under /var/www
      # (e.g., Composer writing into ./vendor) would restart all the Supervisord-managed servers.
      ROOT_DIR: /var/www/examples
      AUTORELOAD_PROGRAMS: "http1 http1-integrated http2 rock-paper-scissors tcp-event-driven tcp-coroutine-style udp websocket"
      DISABLE_DEFAULT_SERVER: 1
    ports:
      - 9801:9801
    volumes:
      - .:/var/www
  client:
    image: deminy/swoole-by-examples:client-6.2
    environment:
      DISABLE_DEFAULT_SERVER: 1
    links:
      - mysql
      - postgresql
      - redis
      - server
    volumes:
      - .:/var/www
  # A thread-safe (ZTS) build of PHP, which the examples under examples/threads/ (and locks/lock-across-threads.php)
  # need; the server and client images are non-ZTS. The official image is used as-is, with the same layout as the
  # other two containers.
  zts:
    image: phpswoole/swoole:6.2-php8.4-zts
    environment:
      DISABLE_DEFAULT_SERVER: 1
    working_dir: /var/www/examples
    volumes:
      - .:/var/www
  redis:
    image: redis:8-alpine
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: test
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: username
  postgresql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
