name: Tests

on: [ push, pull_request, workflow_dispatch ]

jobs:
  tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # composer.json lives at the repository root (/var/www), while the containers default to /var/www/examples,
      # hence the explicit `-w /var/www`. All three PHP containers mount the repository root, so installing
      # dependencies once from the client container serves the server and zts containers as well. Before anything connects to them, the
      # workflow waits (up to 60 seconds) until "supervisorctl status" lists every Supervisord-managed server as
      # RUNNING, and fails if they aren't by then. (The command's exit status alone isn't enough: it is 0 while the
      # programs are still STARTING.)
      # The server/client images are built here from the repository's own Dockerfiles rather than pulled: the
      # published images on Docker Hub are only updated by the build_docker_images workflow AFTER a push to master,
      # so a push that changes the images themselves (e.g., adding a new Supervisord-managed server example) would
      # otherwise run its tests against the previous, stale images and fail. Building locally also means Dockerfile
      # problems surface in this workflow before the images are ever published. The datastore images (redis, mysql,
      # postgresql) are still pulled automatically by `docker compose up`.
      - name: Prepare Test Environment
        run: |
          docker build -t deminy/swoole-by-examples:server-6.2 dockerfiles/server
          docker build -t deminy/swoole-by-examples:client-6.2 dockerfiles/client
          docker compose up -d
          for i in $(seq 60); do
            states=$(docker compose exec -T server supervisorctl status 2>/dev/null | awk '{print $2}' | sort -u)
            [ "$states" = "RUNNING" ] && break
            sleep 1
          done
          docker compose exec -T server supervisorctl status
          [ "$states" = "RUNNING" ]

          docker compose exec -T client php -v
          docker compose exec -T client php --ri swoole
          docker compose exec -T -w /var/www client composer install -n -q --no-progress

      - name: Run Coding Style Checks
        run: docker compose exec -T -w /var/www client ./vendor/bin/php-cs-fixer fix --dry-run --show-progress=none

      # PHPStan runs inside the client container so that Swoole symbols resolve against the very extension build
      # the examples run on, with predis and swoole/ide-helper coming from the project's own dev dependencies.
      - name: Run Static Analysis
        run: docker compose exec -T -w /var/www client ./vendor/bin/phpstan analyse --no-progress --memory-limit 2G

      # Almost everything is in the client suite; only tests for examples needing PHP extensions installed in the server
      # image alone (APCu, sysvmsg) are in the server suite, and tests for ZTS-only examples are in the zts suite.
      - name: Run Unit Tests
        run: |
          docker compose exec -T -w /var/www client ./vendor/bin/counit --testsuite client
          docker compose exec -T -w /var/www server ./vendor/bin/counit --testsuite server
          docker compose exec -T -w /var/www zts ./vendor/bin/counit --testsuite zts
