name: Build Docker Images

# Images are published only after the Tests workflow has succeeded on master (or on manual dispatch), so a push
# that breaks the tests can never publish broken images to Docker Hub.
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches:
      - master
  workflow_dispatch:

jobs:
  build-docker-images:
    runs-on: ubuntu-24.04
    if: ${{ github.repository == 'deminy/swoole-by-examples' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        type: ["server", "client"]
        version: ["6.2"]

    steps:
      -
        # On workflow_run events the default checkout would be the tip of the default branch; check out the exact
        # commit the Tests workflow ran against instead, so the published images match the tested code. On manual
        # dispatch head_sha is empty and the default checkout behavior applies.
        name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      -
        name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      -
        name: Build and Publish Docker Image
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: ./dockerfiles/${{ matrix.type }}/
          build-args: |
            SWOOLE_VERSION=${{ matrix.version }}
            PHP_VERSION=8.4
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: deminy/swoole-by-examples:${{ matrix.type }}-${{ matrix.version }}
